name = "setplay"
main = "src/server/index.ts"
compatibility_date = "2025-06-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "setplay-db"
database_id = "e37338aa-61ff-49b0-ac79-cd5b62261eaa"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "KV"
id = "c3bf4b93171446a9b9170fad235440c4"

[triggers]
crons = ["* * * * *", "0 */6 * * *"]

[assets]
directory = "dist/client"
binding = "ASSETS"

[vars]
# Non-secret environment variables
# Secrets should be set via: wrangler secret put SECRET_NAME
# Required secrets (set with `wrangler secret put`):
#   TWITCH_CLIENT_ID
#   TWITCH_CLIENT_SECRET
#   STARTGG_API_TOKEN
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT         (e.g. "mailto:your@email.com")
#   ADMIN_TOKEN           (a random secret for /admin/* access)

[dev]
port = 8787
